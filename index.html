<div id="sprite-clinic-app" class="clinic-shell">
  <main class="clinic-layout" aria-label="Midnight sprite animal clinic game">
    <section class="clinic-hero" aria-live="polite">
      <div class="topbar">
        <div>
          <p class="eyebrow">Night <span id="nightNumber">1</span> / 3</p>
          <h1>Midnight Sprite Clinic</h1>
        </div>
        <div class="shift-clock" aria-label="Shift progress">
          <span id="caseCounter">Case 1 of 6</span>
          <div class="clock-track"><span id="clockFill"></span></div>
        </div>
      </div>

      <div class="clinic-stage">
        <div class="room-glow" aria-hidden="true"></div>
        <div id="patientAura" class="patient-aura calm"></div>
        <div id="patientSprite" class="patient-sprite" role="img" aria-label="Current patient">
          <div class="ears"></div>
          <div class="head">
            <span class="eye left"></span>
            <span class="eye right"></span>
            <span class="cheek left"></span>
            <span class="cheek right"></span>
            <span class="mouth"></span>
          </div>
          <div class="body">
            <span class="belly"></span>
          </div>
          <div class="tail"></div>
          <div id="spriteMarks" class="sprite-marks"></div>
        </div>
        <div class="desk">
          <span class="desk-light"></span>
          <span class="desk-card"></span>
          <span class="desk-mug"></span>
        </div>
      </div>
    </section>

    <aside class="triage-panel" aria-label="Triage controls">
      <div class="stats-row">
        <div class="stat"><span>Sanity</span><strong id="sanityValue">100</strong></div>
        <div class="stat"><span>Wage</span><strong id="wageValue">$0</strong></div>
        <div class="stat"><span>Errors</span><strong id="errorValue">0</strong></div>
      </div>

      <article class="case-card">
        <div class="case-header">
          <div>
            <p id="patientKind" class="eyebrow">Moonbun</p>
            <h2 id="patientName">Luma</h2>
          </div>
          <span id="riskBadge" class="risk-badge">Unknown</span>
        </div>
        <p id="caseText" class="case-text"></p>
        <ul id="clueList" class="clue-list"></ul>
      </article>

      <div class="action-grid" aria-label="Choose triage action">
        <button type="button" class="action-btn" data-action="treat">
          <span>Treat</span><small>Normal care</small>
        </button>
        <button type="button" class="action-btn" data-action="quarantine">
          <span>Quarantine</span><small>Contain anomaly</small>
        </button>
        <button type="button" class="action-btn" data-action="comfort">
          <span>Comfort</span><small>Calm sprite</small>
        </button>
        <button type="button" class="action-btn" data-action="alarm">
          <span>Alarm</span><small>Emergency seal</small>
        </button>
      </div>

      <div id="resultBox" class="result-box" aria-live="polite"></div>
      <button id="nextButton" type="button" class="primary-btn">Start shift</button>
    </aside>
  </main>

  <section class="log-panel" aria-label="Shift log">
    <h2>Shift log</h2>
    <ol id="logList"></ol>
  </section>
</div>

<script>
(() => {
  const cases = [
    {
      name: "Luma",
      kind: "Moonbun",
      color: "#f7c98f",
      text: "A round moonbun floats onto the desk with a ribbon tied around one ear.",
      clues: ["Temperature is warm but stable.", "Shadow stays attached to its paws.", "It hums when the clinic bell rings."],

    {

    {
      name: "Nini",

      action: "quarantine",

      aura: "weird",

    },
    {
      name: "Bobo",
      kind: "Star Calf",
      color: "#e6b2ff",
      text: "A sleepy calf sprite has a star-shaped bruise that rotates slowly above its cheek.",
      clues: ["Breathing is calm.", "The star mark rotates counterclockwise.", "It asks for sugar water exactly three times."],
      action: "treat",
      risk: "Treatable",
      aura: "weird",
      marks: ["mark-star"]
    },
    {
      name: "Mochi",
      kind: "Cloud Cat",
      color: "#f4f1ff",
      text: "The cloud cat looks adorable, but every clock in the room is now five minutes behind.",
      clues: ["Purrs in two voices.", "Tail points against gravity.", "Its shadow is under the ceiling lamp."],
      action: "quarantine",
      risk: "Anomaly",
      aura: "weird",
      marks: ["mark-shadow"]
    },
    {
      name: "Taffy",
      kind: "Candy Ferret",
      color: "#ffb2ce",
      text: "A candy ferret rolls in holding a tiny blanket and a very dramatic cough.",
      clues: ["Sugar crystals on whiskers.", "Pawprints are visible and normal.", "Cough stops when offered warm milk."],
      action: "comfort",
      risk: "Nervous",
      aura: "calm",
      marks: []
    },
    {
      name: "Rune",
      kind: "Ink Owl",
      color: "#8f8cff",
      text: "An owl sprite blinks sideways. Its medical tag has tomorrow's date.",
      clues: ["Feathers drip upward.", "It repeats your last sentence before you say it.", "The exam lamp casts no shadow."],
      action: "alarm",
      risk: "Danger",
      aura: "danger",
      marks: ["mark-eye", "mark-shadow"]
    },
    {
      name: "Fenn",
      kind: "Lantern Deer",
      color: "#ffd26f",
      text: "A deer sprite carries a glowing lantern between its antlers and bows politely.",
      clues: ["Lantern dims when it is scared.", "Hoofprints glow, then fade.", "It reacts gently to the nurse bell."],
      action: "comfort",
      risk: "Nervous",
      aura: "calm",
      marks: []
    },
    {
      name: "Kiki",
      kind: "Paper Seal",
      color: "#f0e0c6",

      action: "treat",
      risk: "Normal",
      aura: "calm",
      marks: []
    },
    {
      name: "Velvet",
      kind: "Mirror Moth",
      color: "#b79cff",
      text: "The moth sprite never lands. Its reflection is larger than its body.",
      clues: ["Wing dust forms tiny door shapes.", "Reflection blinks one beat late.", "Your clipboard lists a patient you never admitted."],
      action: "quarantine",
      risk: "Anomaly",
      aura: "weird",
      marks: ["mark-eye"]
    },
    {
      name: "Glim",
      kind: "Button Frog",
      color: "#84e7bf",
      text: "A frog wearing a button hat has swallowed a charm and looks deeply embarrassed.",
      clues: ["Charm chimes inside its belly.", "Eyes are bright and symmetrical.", "It follows the flashlight normally."],
      action: "treat",
      risk: "Treatable",
      aura: "calm",
      marks: []
    },
    {
      name: "No. 7",
      kind: "Unknown Kit",
      color: "#ff7c7c",
      text: "A kitten-shaped sprite sits perfectly still. The door behind it is still locked from the inside.",
      clues: ["It has no reflection in the medicine cabinet.", "It knows your wage total.", "The bell rings without moving."],
      action: "alarm",
      risk: "Danger",
      aura: "danger",
      marks: ["mark-eye", "mark-shadow", "mark-star"]
    }
  ];

  const state = {
    night: 1,
    caseIndex: 0,
    sanity: 100,
    wage: 0,
    errors: 0,
    activeCases: [],
    locked: true,
    finished: false
  };

  const el = {
    nightNumber: document.getElementById("nightNumber"),
    caseCounter: document.getElementById("caseCounter"),
    clockFill: document.getElementById("clockFill"),
    sanityValue: document.getElementById("sanityValue"),
    wageValue: document.getElementById("wageValue"),
    errorValue: document.getElementById("errorValue"),
    patientKind: document.getElementById("patientKind"),
    patientName: document.getElementById("patientName"),
    caseText: document.getElementById("caseText"),
    clueList: document.getElementById("clueList"),
    riskBadge: document.getElementById("riskBadge"),
    resultBox: document.getElementById("resultBox"),
    nextButton: document.getElementById("nextButton"),
    patientSprite: document.getElementById("patientSprite"),
    patientAura: document.getElementById("patientAura"),
    spriteMarks: document.getElementById("spriteMarks"),
    logList: document.getElementById("logList")
  };

  const actionLabel = {
    treat: "Treat",
    quarantine: "Quarantine",
    comfort: "Comfort",
    alarm: "Alarm"
  };

  function shuffle(source) {
    return [...source].sort(() => Math.random() - 0.5);
  }

  function startNight() {
    state.activeCases = shuffle(cases).slice(0, 6);
    state.caseIndex = 0;
    state.locked = false;
    state.finished = false;
    el.logList.innerHTML = "";
    el.nextButton.textContent = "Next patient";
    renderCase();
    updateStats();
  }

  function renderCase() {
    const current = state.activeCases[state.caseIndex];
    if (!current) return endNight();

    el.nightNumber.textContent = state.night;
    el.caseCounter.textContent = `Case ${state.caseIndex + 1} of ${state.activeCases.length}`;
    el.clockFill.style.width = `${(state.caseIndex / state.activeCases.length) * 100}%`;
    el.patientKind.textContent = current.kind;
    el.patientName.textContent = current.name;
    el.caseText.textContent = current.text;
    el.riskBadge.textContent = current.risk;
    el.clueList.innerHTML = current.clues.map(clue => `<li>${clue}</li>`).join("");
    el.resultBox.textContent = "Read the clues, then choose the safest triage response.";
    el.resultBox.className = "result-box";
    el.patientSprite.style.setProperty("--sprite-color", current.color);
    el.patientSprite.classList.add("float");
    el.patientAura.className = `patient-aura ${current.aura}`;
    el.spriteMarks.innerHTML = current.marks.map(mark => `<span class="${mark}"></span>`).join("");
    document.querySelectorAll(".action-btn").forEach(button => { button.disabled = false; });
    state.locked = false;
  }

  function updateStats() {
    el.sanityValue.textContent = state.sanity;
    el.wageValue.textContent = `$${state.wage}`;
    el.errorValue.textContent = state.errors;
  }

  function chooseAction(action) {
    if (state.locked || state.finished) return;
    const current = state.activeCases[state.caseIndex];
    const correct = action === current.action;
    state.locked = true;
    document.querySelectorAll(".action-btn").forEach(button => { button.disabled = true; });

    if (correct) {
      state.wage += current.risk === "Danger" ? 90 : 55;
      state.sanity = Math.min(100, state.sanity + 3);
      el.resultBox.className = "result-box good";
      el.resultBox.textContent = `Correct. ${current.name} was handled with ${actionLabel[action].toLowerCase()}. The clinic hums a little softer.`;
    } else {
      const loss = current.risk === "Danger" ? 28 : 16;
      state.sanity = Math.max(0, state.sanity - loss);
      state.errors += 1;
      el.resultBox.className = "result-box bad";
      el.resultBox.textContent = `Wrong call. ${current.name} needed ${actionLabel[current.action].toLowerCase()}. The ward lights flicker.`;
    }

    const log = document.createElement("li");
    log.textContent = `${current.name} the ${current.kind}: ${correct ? "cleared" : "incident"} (${actionLabel[action]}).`;
    el.logList.prepend(log);
    updateStats();
    el.clockFill.style.width = `${((state.caseIndex + 1) / state.activeCases.length) * 100}%`;
    el.nextButton.textContent = state.caseIndex + 1 >= state.activeCases.length ? "End night" : "Next patient";
  }

  function nextStep() {
    if (state.finished || state.activeCases.length === 0) {
      state.sanity = 100;
      state.wage = 0;
      state.errors = 0;
      startNight();
      return;
    }
    if (!state.locked) return;
    state.caseIndex += 1;
    renderCase();
  }

  function endNight() {
    state.finished = true;
    state.locked = true;
    document.querySelectorAll(".action-btn").forEach(button => { button.disabled = true; });
    const survived = state.sanity > 0 && state.errors < 4;
    const bonus = survived ? 120 : 0;
    state.wage += bonus;
    updateStats();
    el.caseCounter.textContent = "Shift complete";
    el.clockFill.style.width = "100%";
    el.patientKind.textContent = survived ? "Dawn report" : "Incident report";
    el.patientName.textContent = survived ? "Clinic survived" : "Clinic sealed";
    el.caseText.textContent = survived
      ? `You made it to sunrise with ${state.errors} incident${state.errors === 1 ? "" : "s"}. Bonus paid: $${bonus}.`
      : "The emergency shutters came down before sunrise. The sprites will remember this night.";
    el.clueList.innerHTML = [
      `<li>Final sanity: ${state.sanity}</li>`,
      `<li>Total wage: $${state.wage}</li>`,
      `<li>Errors recorded: ${state.errors}</li>`
    ].join("");
    el.riskBadge.textContent = survived ? "Survived" : "Sealed";
    el.resultBox.className = survived ? "result-box good" : "result-box bad";
    el.resultBox.textContent = survived ? "The waiting room smells like warm milk and morning rain." : "Something in the ward learned your name.";
    el.nextButton.textContent = state.night >= 3 ? "Restart" : "Next night";
    state.night = state.night >= 3 ? 1 : state.night + 1;
  }

  document.querySelectorAll(".action-btn").forEach(button => {
    button.addEventListener("click", () => chooseAction(button.dataset.action));
    button.disabled = true;
  });

  el.nextButton.addEventListener("click", () => {
    if (state.activeCases.length === 0) startNight();
    else nextStep();
  });

  el.caseText.textContent = "The clinic opens at midnight. Start the shift when you are ready.";
  el.clueList.innerHTML = "<li>Q-version sprite animals arrive one by one.</li><li>Normal illness, panic, anomaly, and danger require different responses.</li><li>Survive three nights to keep the clinic license.</li>";
})();
</script>
