<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Goodnight Clinic</title>
    <meta
      name="description"
      content="A cozy spooky dream clinic game about collecting nightmares and sending critters home with gentle dreams."
    >
    <link rel="stylesheet" href="./styles/theme.css">
    <link rel="stylesheet" href="./styles/app.css">
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="clinic-header">
        <div>
          <p class="eyebrow">Midnight dream repair</p>
          <h1>Goodnight Clinic</h1>
        </div>
        <div class="shift-summary" aria-label="Shift status">
          <span>Night <strong id="nightValue">1</strong></span>
          <span>Case <strong id="caseValue">1</strong>/<strong id="caseTotal">5</strong></span>
          <span>Hope <strong id="hopeValue">3</strong></span>
          <button id="audioToggle" type="button" class="audio-toggle" aria-pressed="false">Sound off</button>
        </div>
      </header>

      <main class="game-layout">
        <section class="dream-stage" aria-label="Dream patient">
          <div class="moon-window" aria-hidden="true"></div>
          <div id="dreamMist" class="dream-mist is-soft" aria-hidden="true"></div>
          <div class="patient-card" aria-live="polite">
            <div id="patientSprite" class="patient-sprite" role="img" aria-label="Current dream critter">
              <span class="sprite-ear left"></span>
              <span class="sprite-ear right"></span>
              <span class="sprite-face">
                <span class="sprite-eye left"></span>
                <span class="sprite-eye right"></span>
                <span class="sprite-blush left"></span>
                <span class="sprite-blush right"></span>
                <span class="sprite-mouth"></span>
              </span>
              <span class="sprite-body">
                <span class="sprite-belly"></span>
              </span>
              <span class="sprite-tail"></span>
              <span id="nightmareMark" class="nightmare-mark"></span>
            </div>
          </div>
          <div class="workbench" aria-hidden="true">
            <span class="prop bottle"></span>
            <span class="prop chart"></span>
            <span class="prop bell"></span>
          </div>
        </section>

        <section class="case-board" aria-label="Dream chart">
          <div class="meter-row">
            <div>
              <span>Warmth</span>
              <strong id="warmthValue">80</strong>
            </div>
            <div>
              <span>Nightmares</span>
              <strong id="nightmareValue">0</strong>
            </div>
            <div>
              <span>Dream dust</span>
              <strong id="dustValue">0</strong>
            </div>
          </div>

          <article class="dream-chart">
            <div class="chart-heading">
              <div>
                <p id="patientSpecies" class="eyebrow">Moonbun</p>
                <h2 id="patientName">Luma</h2>
              </div>
              <span id="toneBadge" class="tone-badge">soft ache</span>
            </div>
            <p id="caseIntro" class="case-intro"></p>
            <ul id="clueList" class="clue-list"></ul>
          </article>

          <div class="choice-grid" aria-label="Dream treatment choices">
            <button type="button" class="choice-button" data-action="listen">
              <span>Listen</span>
              <small>find the real wish</small>
            </button>
            <button type="button" class="choice-button" data-action="soothe">
              <span>Soothe</span>
              <small>steady the nightmare</small>
            </button>
            <button type="button" class="choice-button" data-action="bottle">
              <span>Bottle</span>
              <small>seal the sharp dream</small>
            </button>
            <button type="button" class="choice-button" data-action="wake">
              <span>Wake</span>
              <small>return to morning</small>
            </button>
          </div>

          <div id="resultPanel" class="result-panel" aria-live="polite">
            Open the clinic when the moon reaches the window.
          </div>
          <button id="nextButton" type="button" class="primary-action">Open clinic</button>
        </section>
      </main>

      <section class="closing-board" aria-label="Dream log">
        <div>
          <p class="eyebrow">Dream log</p>
          <h2>Tonight's repairs</h2>
        </div>
        <ol id="dreamLog" class="dream-log"></ol>
      </section>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
